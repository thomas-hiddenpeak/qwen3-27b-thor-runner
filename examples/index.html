<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3 Voice — 语音对话 & TTS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== Header ========== -->
<header class="header">
  <h1>🎙️ Qwen3 Voice</h1>
  <nav class="header-controls">
    <div class="ws-status">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsLabel">未连接</span>
    </div>
    <div class="mode-toggle" role="group" aria-label="对话模式">
      <button id="modeText" class="active" onclick="setMode('text')">文字</button>
      <button id="modeVoice" onclick="setMode('voice')">语音</button>
      <button id="modeAuto" onclick="setMode('auto')">自动</button>
    </div>
    <button id="stopTtsBtn" onclick="stopTts()" style="display:none;padding:4px 10px;background:#e74c3c;border:none;border-radius:5px;color:white;font-size:11px;cursor:pointer;" title="停止语音播放">⏹ 停止</button>
    <button onclick="toggleSidebar()" style="padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;cursor:pointer;" title="显示/隐藏设置面板">⚙️ 设置</button>
  </nav>
</header>

<!-- ========== Main Split Layout ========== -->
<main class="split-layout">

  <!-- ===== Left Panel: Chat ===== -->
  <div class="left-panel">

    <!-- ASR Monitor Panel -->
    <section class="asr-monitor" id="asrMonitor" aria-label="ASR 监控">
      <div class="asr-monitor-header" onclick="toggleAsrMonitor()">
        <span>📡 ASR 监控 <span id="asrMonitorCount" style="font-weight:400;color:var(--text2);font-size:11px;"></span></span>
        <div class="asr-monitor-controls" onclick="event.stopPropagation()">
          <label title="ASR 识别结果是否导入 LLM 生成回复">
            <span>ASR→LLM</span>
            <label class="toggle-switch">
              <input type="checkbox" id="asrToLlmToggle" checked onchange="onAsrToLlmChanged()">
              <span class="toggle-slider"></span>
            </label>
          </label>
          <span class="toggle-icon" id="asrMonitor_icon">▾</span>
        </div>
      </div>
      <div class="asr-monitor-body" id="asrMonitorBody">
        <p class="asr-log-empty" id="asrLogEmpty">等待语音输入...</p>
        <div id="asrLogList"></div>
      </div>
      <div class="asr-monitor-actions" id="asrMonitorActions">
        <button class="btn btn-secondary btn-sm" onclick="saveAsrLog()" title="保存识别记录到文件">💾 文本</button>
        <button class="btn btn-secondary btn-sm" onclick="saveRecording()" title="保存录音为 WAV 文件">🎵 录音</button>
        <button class="btn btn-secondary btn-sm" onclick="clearAsrLog()" title="清空识别记录">🗑 清空</button>
        <span id="asrLogInfo" style="font-size:11px;color:var(--text2);margin-left:auto;"></span>
      </div>
    </section>

    <div class="chat-area" id="chatArea" role="log" aria-label="对话记录">
      <article class="message assistant">
        <div class="role-tag">Assistant</div>
        <div class="content">你好！我是 Qwen 语音助手。你可以用文字或语音和我对话。</div>
      </article>
    </div>

    <div class="status-bar" id="statusBar" role="status" aria-live="polite"></div>

    <footer class="input-area">
      <div class="input-row">
        <textarea id="inputText" placeholder="输入消息... (Ctrl+Enter 发送)" rows="1"
                  oninput="autoResize(this)" aria-label="消息输入"></textarea>
        <button class="mic-btn" id="micBtn" onclick="toggleRecording()" title="按住说话" aria-label="麦克风">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="settings-row">
        <span id="recordingStatus"></span>
      </div>
    </footer>
  </div>

  <!-- ===== Right Panel: Settings ===== -->
  <aside class="right-panel" id="rightPanel" aria-label="设置面板">

    <!-- Section 1: 对话设置 -->
    <section class="panel-section">
      <div class="panel-header" onclick="togglePanel('chatSettingsBody')">
        <span>💬 对话设置</span>
        <span class="toggle-icon" id="chatSettingsBody_icon">▾</span>
      </div>
      <div class="panel-body" id="chatSettingsBody">
        <div class="form-group" id="voiceSelectGroup">
          <label class="form-label" for="voiceSelect">说话人</label>
          <select id="voiceSelect" onchange="onVoiceChanged(); sendConfig()">
            <option value="serena">Serena</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="langSelect">语言/方言</label>
          <select id="langSelect" onchange="sendConfig()">
            <option value="">自动</option>
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px;">
          <span class="form-label" style="margin-bottom:0">语音合成</span>
          <label class="toggle-switch">
            <input type="checkbox" id="ttsToggle" checked onchange="sendConfig()">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Section 2: 采样参数 -->
    <section class="panel-section">
      <div class="panel-header" onclick="togglePanel('samplingBody')">
        <span>⚙️ 采样参数</span>
        <span class="toggle-icon collapsed" id="samplingBody_icon">▾</span>
      </div>
      <div class="panel-body collapsed" id="samplingBody">
        <div class="param-row">
          <label for="ttsTemp">Temperature</label>
          <input type="range" id="ttsTemp" min="0.1" max="1.5" step="0.05" value="0.9"
                 oninput="document.getElementById('ttsTempVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="ttsTempVal">0.9</span>
        </div>
        <div class="param-row">
          <label for="ttsTopK">Top-K</label>
          <input type="range" id="ttsTopK" min="1" max="100" step="1" value="50"
                 oninput="document.getElementById('ttsTopKVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="ttsTopKVal">50</span>
        </div>
        <div class="param-row">
          <label for="ttsTopP">Top-P</label>
          <input type="range" id="ttsTopP" min="0.1" max="1.0" step="0.05" value="1.0"
                 oninput="document.getElementById('ttsTopPVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="ttsTopPVal">1.0</span>
        </div>
        <div class="param-row">
          <label for="ttsRepPenalty">Rep Penalty</label>
          <input type="range" id="ttsRepPenalty" min="1.0" max="1.5" step="0.01" value="1.05"
                 oninput="document.getElementById('ttsRepVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="ttsRepVal">1.05</span>
        </div>
        <div class="param-row">
          <label for="voiceMaxTurns">对话轮次</label>
          <input type="range" id="voiceMaxTurns" min="1" max="50" step="1" value="10"
                 oninput="document.getElementById('voiceMaxTurnsVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="voiceMaxTurnsVal">10</span>
        </div>
        <div class="param-row">
          <label for="voiceMaxOutputTokens">输出上限</label>
          <input type="range" id="voiceMaxOutputTokens" min="10" max="1024" step="10" value="150"
                 oninput="document.getElementById('voiceMaxOutputTokensVal').textContent=this.value" onchange="sendConfig()">
          <span class="param-val" id="voiceMaxOutputTokensVal">150</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="resetTtsDefaults()" style="margin-top:4px;">重置默认</button>
      </div>
    </section>

    <!-- Section 3: 系统提示词 -->
    <section class="panel-section">
      <div class="panel-header" onclick="togglePanel('sysPromptBody')">
        <span>📝 系统提示词</span>
        <span class="toggle-icon collapsed" id="sysPromptBody_icon">▾</span>
      </div>
      <div class="panel-body collapsed" id="sysPromptBody">
        <textarea id="systemPromptEditor" rows="6" placeholder="输入系统提示词..."
                  style="min-height:100px;font-size:12px;line-height:1.5;" aria-label="系统提示词"></textarea>
        <div class="btn-row">
          <button class="btn btn-sm" style="background:#27ae60;color:white;" onclick="applySystemPrompt()">应用</button>
          <button class="btn btn-secondary btn-sm" onclick="resetSystemPrompt()">恢复默认</button>
        </div>
      </div>
    </section>

    <!-- Section 4: 音色设计 (voice_design only) -->
    <section class="panel-section" id="voiceDesignSection" style="display:none">
      <div class="panel-header" onclick="togglePanel('voiceDesignBody')">
        <span>🎨 音色设计</span>
        <span class="toggle-icon" id="voiceDesignBody_icon">▾</span>
      </div>
      <div class="panel-body" id="voiceDesignBody">
        <div class="form-group">
          <label class="form-label" for="ttsInstruct">音色描述 (Instruct)</label>
          <input type="text" id="ttsInstruct" placeholder="例: 请用温柔甜美的女声朗读" onchange="sendConfig()">
          <p class="hint">描述期望的音色特征,用于控制生成语音的风格</p>
        </div>
      </div>
    </section>

    <!-- Section 5: 音色克隆 -->
    <section class="panel-section" id="voiceCloneSection" style="display:none">
      <div class="panel-header" onclick="togglePanel('voiceCloneBody')">
        <span>🎤 音色克隆</span>
        <span class="toggle-icon" id="voiceCloneBody_icon">▾</span>
      </div>
      <div class="panel-body" id="voiceCloneBody">
        <div class="form-group">
          <label class="form-label" for="cloneVoiceName">音色名称</label>
          <input type="text" id="cloneVoiceName" placeholder="英文/数字/下划线">
        </div>

        <div class="form-group">
          <label class="form-label">参考音频</label>
          <div class="clone-audio-actions">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0;">
              📁 选择文件
              <input type="file" id="cloneAudioFile" accept="audio/*" style="display:none;" onchange="onCloneFileSelected(this)">
            </label>
            <button class="btn btn-secondary btn-sm" id="cloneRecordBtn" onclick="toggleCloneRecord()">🎙 录音</button>
          </div>
          <p id="cloneFileInfo" class="hint"></p>
          <p id="cloneRecordingStatus" style="font-size:12px;color:var(--recording);margin-top:4px;display:none;">
            ● 正在录音... <span id="cloneRecordTime">0s</span>
          </p>
        </div>

        <div class="form-group">
          <label class="form-label" for="cloneRefText">参考文本 <span style="font-weight:normal;color:var(--text2)">(可选,提升克隆效果)</span></label>
          <div style="display:flex;gap:6px;">
            <textarea id="cloneRefText" rows="2" placeholder="输入参考音频对应的文本内容..." style="min-height:48px;flex:1;"></textarea>
            <button class="btn btn-secondary btn-sm" id="cloneAsrBtn" onclick="recognizeCloneAudio()" title="自动识别参考音频文本" style="flex-shrink:0;height:fit-content;margin-top:0;" disabled>🔍 识别</button>
          </div>
          <p id="cloneRefTextStatus" class="hint"></p>
        </div>

        <button class="btn btn-primary" onclick="registerCloneVoice()" style="margin-top:4px;">
          ✨ 注册音色
        </button>
        <p id="cloneRegStatus" class="hint" style="margin-top:4px;"></p>
      </div>
    </section>

    <!-- Section 6: 说话人管理 -->
    <section class="panel-section" id="speakerMgmtSection" style="display:none">
      <div class="panel-header" onclick="togglePanel('speakerMgmtBody')">
        <span>👤 说话人管理</span>
        <span class="toggle-icon" id="speakerMgmtBody_icon">▾</span>
      </div>
      <div class="panel-body" id="speakerMgmtBody">
        <div class="speaker-list" id="speakerList">
          <p class="speaker-empty" id="speakerEmpty">暂无已注册说话人</p>
        </div>

        <hr class="divider">

        <div class="form-group">
          <label class="form-label" for="spkRegName">注册说话人</label>
          <input type="text" id="spkRegName" placeholder="说话人名称">
        </div>
        <div class="form-group">
          <label class="form-label">音频文件</label>
          <div class="clone-audio-actions">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0;">
              📁 选择文件
              <input type="file" id="spkRegAudio" accept="audio/*" style="display:none;" onchange="onSpkFileSelected(this)">
            </label>
            <button class="btn btn-secondary btn-sm" id="spkRecordBtn" onclick="toggleSpkRecord()">🎙 录音</button>
          </div>
          <p id="spkFileInfo" class="hint"></p>
          <p id="spkRecordingStatus" style="font-size:12px;color:var(--recording);margin-top:4px;display:none;">
            ● 正在录音... <span id="spkRecordTime">0s</span>
          </p>
        </div>
        <button class="btn btn-primary" onclick="registerSpeaker()">
          ✨ 注册说话人
        </button>
        <p id="spkRegStatus" class="hint" style="margin-top:4px;"></p>

        <hr class="divider">

        <button class="btn-danger btn-sm" onclick="clearAllSpeakers()" style="width:100%;text-align:center;padding:6px;">
          🗑 清空所有说话人
        </button>
      </div>
    </section>

    <!-- Section 7: 录音转写 -->
    <section class="panel-section" id="fileTranscribeSection" style="display:none">
      <div class="panel-header" onclick="togglePanel('fileTranscribeBody')">
        <span>📄 录音转写</span>
        <span class="toggle-icon" id="fileTranscribeBody_icon">▾</span>
      </div>
      <div class="panel-body" id="fileTranscribeBody">
        <div class="form-group">
          <label class="form-label">音频文件</label>
          <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0;display:inline-flex;">
            📁 选择文件
            <input type="file" id="transcribeAudioFile" accept="audio/*" style="display:none;" onchange="onTranscribeFileSelected(this)">
          </label>
          <p id="transcribeFileInfo" class="hint"></p>
        </div>

        <fieldset class="form-group" style="border:none;padding:0;">
          <legend class="form-label">选项</legend>
          <div style="display:flex;gap:12px;font-size:12px;">
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
              <input type="checkbox" id="transcribePunctuate" checked> 标点恢复
            </label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
              <input type="checkbox" id="transcribeSpeaker" checked> 说话人识别
            </label>
          </div>
        </fieldset>

        <div class="form-group">
          <label class="form-label" for="transcribeFormat">响应格式</label>
          <select id="transcribeFormat">
            <option value="verbose_json">详细 JSON</option>
            <option value="json">简洁 JSON</option>
            <option value="text">纯文本</option>
          </select>
        </div>

        <button class="btn btn-primary" id="transcribeBtn" onclick="transcribeFile()">
          🔍 开始转写
        </button>

        <p class="hint" id="transcribeStatus" style="margin-top:4px;"></p>

        <div id="transcribeResult" style="display:none;">
          <div class="transcription-result" id="transcribeResultText"></div>
          <div class="transcription-meta" id="transcribeResultMeta"></div>
          <div style="margin-top:6px;">
            <button class="btn btn-secondary btn-sm" onclick="copyTranscribeResult()">📋 复制</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 8: 语音合成 -->
    <section class="panel-section">
      <div class="panel-header" onclick="togglePanel('ttsSynthBody')">
        <span>🔊 语音合成</span>
        <span class="toggle-icon" id="ttsSynthBody_icon">▾</span>
      </div>
      <div class="panel-body" id="ttsSynthBody">
        <div class="form-group">
          <label class="form-label" for="ttsInputText">输入文本</label>
          <textarea id="ttsInputText" rows="3" placeholder="请输入要合成的文本...">你好，我是通义千问。很高兴为你服务！</textarea>
          <div class="presets" role="group" aria-label="文本预设">
            <span class="preset" data-text="你好，我是通义千问。很高兴为你服务！">中文问候</span>
            <span class="preset" data-text="Hello, I'm Qwen. How can I help you today?">English</span>
            <span class="preset" data-text="春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。">古诗</span>
            <span class="preset" data-text="今天天气真好，我们一起出去散步吧。阳光明媚，微风轻拂，正是踏青的好时节。">长句</span>
          </div>
        </div>

        <div class="form-group" id="synthVoiceGroup">
          <div class="row-flex">
            <div>
              <label class="form-label" for="ttsVoiceSelect">说话人</label>
              <select id="ttsVoiceSelect" onchange="updateTtsLangSelect()">
                <option value="serena">Serena</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="ttsLangSelect">语言</label>
              <select id="ttsLangSelect">
                <option value="">自动</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group" id="synthCloneGroup" style="display:none">
          <label class="form-label" for="cloneVoiceSelect">克隆音色</label>
          <div style="display:flex;gap:6px;">
            <select id="cloneVoiceSelect" style="flex:1;" onchange="updateTtsLangSelect(true)">
              <option value="">(请先注册音色)</option>
            </select>
            <button class="btn-danger btn-sm" onclick="deleteCloneVoice()" title="删除选中音色">🗑</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="formatSelect">输出格式</label>
          <select id="formatSelect">
            <option value="wav">WAV</option>
            <option value="pcm">PCM (raw)</option>
          </select>
        </div>

        <button class="btn btn-primary" id="synthesizeBtn" onclick="synthesizeTts()">
          合成语音
        </button>

        <div class="tts-status" id="ttsStatus" role="status"></div>

        <div class="player" id="ttsPlayer">
          <audio id="ttsAudioPlayer" controls></audio>
          <div class="player-info">
            <span id="ttsAudioInfo"></span>
            <button class="btn btn-secondary btn-sm" onclick="downloadAudio()">⬇ 下载</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 9: 合成历史 -->
    <section class="panel-section" id="ttsHistoryCard" style="display:none">
      <div class="panel-header" onclick="togglePanel('ttsHistoryBody')">
        <span>📜 合成历史</span>
        <span class="toggle-icon" id="ttsHistoryBody_icon">▾</span>
      </div>
      <div class="panel-body" id="ttsHistoryBody">
        <div id="ttsHistoryList"></div>
      </div>
    </section>

  </aside>
</main>

<script src="js/app.js"></script>
</body>
</html>
