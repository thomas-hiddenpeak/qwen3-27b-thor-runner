<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3 Voice Chat — WebSocket 语音对话</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --primary: #6c8aff;
  --primary-hover: #8da4ff;
  --text: #e4e6eb;
  --text2: #9ca0ab;
  --border: #2e3345;
  --success: #4ade80;
  --error: #f87171;
  --recording: #ef4444;
  --radius: 12px;
  --user-bg: #2a3154;
  --assistant-bg: #1e2636;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.header-controls label { font-size: 12px; color: var(--text2); }

.header-controls select {
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  max-width: 80%;
  padding: 14px 18px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 15px;
}

.message.user {
  align-self: flex-end;
  background: var(--user-bg);
  border: 1px solid rgba(108, 138, 255, 0.2);
}

.message.assistant {
  align-self: flex-start;
  background: var(--assistant-bg);
  border: 1px solid var(--border);
}

.message .role-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.message .content {
  white-space: pre-wrap;
  word-break: break-word;
}

.message audio {
  display: block;
  margin-top: 8px;
  width: 100%;
  height: 36px;
  border-radius: 6px;
}

.message .meta {
  font-size: 11px;
  color: var(--text2);
  margin-top: 6px;
}

.input-area {
  padding: 16px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  max-width: 960px;
  margin: 0 auto;
}

.input-row textarea {
  flex: 1;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  outline: none;
  font-family: inherit;
  max-height: 120px;
  min-height: 44px;
}

.input-row textarea:focus { border-color: var(--primary); }
.input-row textarea::placeholder { color: var(--text2); }

.mic-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.mic-btn:hover { border-color: var(--primary); background: rgba(108, 138, 255, 0.1); }

.mic-btn.recording {
  border-color: var(--recording);
  background: rgba(239, 68, 68, 0.15);
  animation: pulse 1.5s ease infinite;
}

.mic-btn svg { width: 22px; height: 22px; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
}

.send-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover:not(:disabled) { background: var(--primary-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 20px; height: 20px; }

.mode-toggle {
  display: flex;
  gap: 4px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 3px;
}

.mode-toggle button {
  padding: 5px 12px;
  font-size: 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.mode-toggle button.active { background: var(--primary); color: #fff; }

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 36px; height: 20px;
}

.toggle-switch input { opacity: 0; width: 0; height: 0; }

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: 0.3s;
}

.toggle-slider:before {
  content: '';
  position: absolute;
  height: 14px; width: 14px;
  left: 2px; bottom: 2px;
  background: var(--text2);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-switch input:checked + .toggle-slider { background: var(--primary); border-color: var(--primary); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: #fff; }

/* Connection status indicator */
.ws-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
}

.ws-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--error);
  transition: background 0.3s;
}

.ws-dot.connected { background: var(--success); }

.settings-row {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text2);
}

/* Status bar */
.status-bar {
  font-size: 12px;
  color: var(--text2);
  text-align: center;
  padding: 6px;
  display: none;
}

.status-bar.visible { display: block; }
.status-bar.error { color: var(--error); }

/* Streaming cursor */
.streaming-cursor::after {
  content: '▊';
  animation: blink 1s step-end infinite;
  color: var(--primary);
}

@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<div class="header">
  <h1>🎙️ Qwen3 Voice Chat <span style="font-size:12px;font-weight:400;opacity:0.6">(WebSocket)</span></h1>
  <div class="header-controls">
    <div class="ws-status">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsLabel">未连接</span>
    </div>
    <div class="mode-toggle">
      <button id="modeText" class="active" onclick="setMode('text')">文字</button>
      <button id="modeVoice" onclick="setMode('voice')">语音</button>
      <button id="modeAuto" onclick="setMode('auto')">自动</button>
    </div>
    <select id="voiceSelect" onchange="sendConfig()">
      <option value="Chelsie">Chelsie</option>
      <option value="serena">Serena</option>
      <option value="Vivian">Vivian</option>
      <option value="Ethan">Ethan</option>
    </select>
    <label>
      <span>TTS</span>
      <label class="toggle-switch">
        <input type="checkbox" id="ttsToggle" checked onchange="sendConfig()">
        <span class="toggle-slider"></span>
      </label>
    </label>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="message assistant">
    <div class="role-tag">Assistant</div>
    <div class="content">你好！我是 Qwen 语音助手 (WebSocket 模式)。你可以用文字或语音和我对话。</div>
  </div>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="input-area">
  <div class="input-row">
    <textarea id="inputText" placeholder="输入消息... (Ctrl+Enter 发送)" rows="1"
              oninput="autoResize(this)"></textarea>
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()" title="按住说话">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="settings-row">
    <span id="recordingStatus"></span>
  </div>
</div>

<script>
// ============================================================================
// State
// ============================================================================
let ws = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let isProcessing = false;
let currentMode = 'text';
let streamingDiv = null;   // 当前正在流式输出的消息 div
let streamingText = '';    // 累积的流式文本
let responseT0 = 0;       // 响应开始时间

// ============================================================================
// WebSocket 连接
// ============================================================================
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/v1/voice';

  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('connected');
    document.getElementById('wsLabel').textContent = '已连接';
    sendConfig();
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('connected');
    document.getElementById('wsLabel').textContent = '已断开';
    // 自动重连
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    setStatus('WebSocket 连接失败', 'error');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleEvent(msg);
  };
}

function sendConfig() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const voice = document.getElementById('voiceSelect').value;
  const tts = document.getElementById('ttsToggle').checked;
  ws.send(JSON.stringify({ type: 'config', voice, tts }));
}

// ============================================================================
// 事件处理
// ============================================================================
function handleEvent(msg) {
  switch (msg.type) {
    case 'session.created':
      clearStatus();
      break;

    case 'config.updated':
      break;

    case 'status':
      if (msg.stage === 'asr') setStatus('正在转录语音...');
      else if (msg.stage === 'tts') setStatus('正在合成语音...');
      break;

    case 'asr':
      // ASR 识别结果 — 显示为用户消息
      addMessage('user', msg.text, null, 'ASR 识别');
      break;

    case 'llm.start':
      // 开始流式输出
      responseT0 = performance.now();
      streamingText = '';
      streamingDiv = createStreamingMessage();
      setStatus('正在生成回复...');
      break;

    case 'llm.delta':
      // 增量文本
      if (streamingDiv) {
        streamingText += msg.delta;
        const contentEl = streamingDiv.querySelector('.content');
        contentEl.textContent = streamingText;
        contentEl.classList.add('streaming-cursor');
        scrollToBottom();
      }
      break;

    case 'llm.done':
      // LLM 完成
      if (streamingDiv) {
        const contentEl = streamingDiv.querySelector('.content');
        contentEl.classList.remove('streaming-cursor');
        const llmTime = ((performance.now() - responseT0) / 1000).toFixed(1);
        let metaText = `LLM ${llmTime}s`;
        if (msg.prompt_tokens) metaText += ` · ${msg.prompt_tokens} prompt`;
        if (msg.completion_tokens) metaText += ` · ${msg.completion_tokens} gen`;
        // meta 先设置, TTS 到达后会更新
        streamingDiv.dataset.llmMeta = metaText;
        let metaEl = streamingDiv.querySelector('.meta');
        if (!metaEl) {
          metaEl = document.createElement('div');
          metaEl.className = 'meta';
          streamingDiv.appendChild(metaEl);
        }
        metaEl.textContent = metaText;
      }
      clearStatus();
      break;

    case 'tts':
      // TTS 音频 (base64 WAV)
      if (msg.data && streamingDiv) {
        const binary = atob(msg.data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'audio/wav' });
        const audioUrl = URL.createObjectURL(blob);

        // 添加 audio 元素
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = audioUrl;
        audio.style.cssText = 'display:block;margin-top:8px;width:100%;height:36px;border-radius:6px;';
        streamingDiv.appendChild(audio);

        // 更新 meta
        const sizeKB = (bytes.length / 1024).toFixed(0);
        const metaEl = streamingDiv.querySelector('.meta');
        if (metaEl) {
          metaEl.textContent = (streamingDiv.dataset.llmMeta || '') + ` · TTS ${sizeKB}KB`;
        }

        // 自动播放
        audio.play().catch(() => {});
        scrollToBottom();
      }
      clearStatus();
      isProcessing = false;
      document.getElementById('sendBtn').disabled = false;
      streamingDiv = null;
      break;

    case 'error':
      setStatus(msg.message || '发生错误', 'error');
      isProcessing = false;
      document.getElementById('sendBtn').disabled = false;
      if (streamingDiv) {
        const contentEl = streamingDiv.querySelector('.content');
        contentEl.classList.remove('streaming-cursor');
        streamingDiv = null;
      }
      break;

    case 'history.cleared':
      break;
  }

  // llm.done 且 TTS 未启用 → 解锁
  if (msg.type === 'llm.done') {
    const ttsEnabled = document.getElementById('ttsToggle').checked;
    const shouldTTS = ttsEnabled && (currentMode === 'voice' || currentMode === 'auto');
    if (!shouldTTS) {
      isProcessing = false;
      document.getElementById('sendBtn').disabled = false;
      streamingDiv = null;
    }
  }
}

// ============================================================================
// UI Helpers
// ============================================================================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  sendConfig();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function setStatus(msg, type = '') {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar visible' + (type ? ' ' + type : '');
}

function clearStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

function scrollToBottom() {
  const chatArea = document.getElementById('chatArea');
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function addMessage(role, content, audioUrl, meta) {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  let html = '<div class="role-tag">' + (role === 'user' ? 'You' : 'Assistant') + '</div>';
  html += '<div class="content">' + escapeHtml(content) + '</div>';
  if (audioUrl) {
    html += '<audio controls src="' + audioUrl + '" style="display:block;margin-top:8px;width:100%;height:36px;border-radius:6px;"></audio>';
  }
  if (meta) {
    html += '<div class="meta">' + escapeHtml(meta) + '</div>';
  }
  div.innerHTML = html;
  chatArea.appendChild(div);
  scrollToBottom();
}

function createStreamingMessage() {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = '<div class="role-tag">Assistant</div><div class="content streaming-cursor"></div>';
  chatArea.appendChild(div);
  scrollToBottom();
  return div;
}

// ============================================================================
// 发送文字消息
// ============================================================================
function sendMessage() {
  const input = document.getElementById('inputText');
  const text = input.value.trim();
  if (!text || isProcessing || !ws || ws.readyState !== WebSocket.OPEN) return;

  input.value = '';
  autoResize(input);

  addMessage('user', text);
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;

  ws.send(JSON.stringify({ type: 'chat', text }));
}

// ============================================================================
// 录音 → ASR
// ============================================================================
async function toggleRecording() {
  if (isProcessing) return;
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length > 0) {
        const blob = new Blob(audioChunks, { type: mimeType });
        await sendAudio(blob);
      }
    };
    mediaRecorder.start(100);
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('recordingStatus').textContent = '🔴 录音中...';
  } catch (err) {
    setStatus('无法访问麦克风: ' + err.message, 'error');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('recordingStatus').textContent = '';
}

async function sendAudio(blob) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    setStatus('WebSocket 未连接', 'error');
    return;
  }

  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;

  // 将音频 blob 转为 base64 发送
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1]; // strip data:...;base64,
    ws.send(JSON.stringify({
      type: 'audio',
      data: base64,
      format: 'webm'
    }));
  };
  reader.readAsDataURL(blob);
}

// ============================================================================
// 键盘快捷键
// ============================================================================
document.getElementById('inputText').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA'
      && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    toggleRecording();
  }
});

// ============================================================================
// 启动
// ============================================================================
connectWS();
</script>
</body>
</html>
