<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3 Voice Chat — 语音对话</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --primary: #6c8aff;
  --primary-hover: #8da4ff;
  --text: #e4e6eb;
  --text2: #9ca0ab;
  --border: #2e3345;
  --success: #4ade80;
  --error: #f87171;
  --recording: #ef4444;
  --radius: 12px;
  --user-bg: #2a3154;
  --assistant-bg: #1e2636;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.header-controls label {
  font-size: 12px;
  color: var(--text2);
}

.header-controls select {
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

/* Chat area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  max-width: 80%;
  padding: 14px 18px;
  border-radius: var(--radius);
  line-height: 1.6;
  font-size: 15px;
  position: relative;
}

.message.user {
  align-self: flex-end;
  background: var(--user-bg);
  border: 1px solid rgba(108, 138, 255, 0.2);
}

.message.assistant {
  align-self: flex-start;
  background: var(--assistant-bg);
  border: 1px solid var(--border);
}

.message .role-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.message .content {
  white-space: pre-wrap;
  word-break: break-word;
}

.message audio {
  display: block;
  margin-top: 8px;
  width: 100%;
  height: 36px;
  border-radius: 6px;
}

.message .meta {
  font-size: 11px;
  color: var(--text2);
  margin-top: 6px;
}

/* Thinking indicator */
.thinking {
  align-self: flex-start;
  padding: 14px 18px;
  background: var(--assistant-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  font-size: 14px;
  display: none;
}

.thinking.visible { display: block; }

.thinking .dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

/* Input area */
.input-area {
  padding: 16px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  max-width: 960px;
  margin: 0 auto;
}

.input-row textarea {
  flex: 1;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  outline: none;
  font-family: inherit;
  max-height: 120px;
  min-height: 44px;
}

.input-row textarea:focus {
  border-color: var(--primary);
}

.input-row textarea::placeholder {
  color: var(--text2);
}

/* Mic button */
.mic-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.mic-btn:hover {
  border-color: var(--primary);
  background: rgba(108, 138, 255, 0.1);
}

.mic-btn.recording {
  border-color: var(--recording);
  background: rgba(239, 68, 68, 0.15);
  animation: pulse 1.5s ease infinite;
}

.mic-btn svg {
  width: 22px;
  height: 22px;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
}

/* Send button */
.send-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover:not(:disabled) {
  background: var(--primary-hover);
}

.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.send-btn svg {
  width: 20px;
  height: 20px;
}

/* Mode toggle */
.mode-toggle {
  display: flex;
  gap: 4px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 3px;
}

.mode-toggle button {
  padding: 5px 12px;
  font-size: 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.mode-toggle button.active {
  background: var(--primary);
  color: #fff;
}

/* Settings */
.settings-row {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text2);
}

.settings-row input[type="text"] {
  padding: 4px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  width: 200px;
  outline: none;
}

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: 0.3s;
}

.toggle-slider:before {
  content: '';
  position: absolute;
  height: 14px;
  width: 14px;
  left: 2px;
  bottom: 2px;
  background: var(--text2);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-switch input:checked + .toggle-slider {
  background: var(--primary);
  border-color: var(--primary);
}

.toggle-switch input:checked + .toggle-slider:before {
  transform: translateX(16px);
  background: #fff;
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Status bar */
.status-bar {
  font-size: 12px;
  color: var(--text2);
  text-align: center;
  padding: 6px;
  display: none;
}

.status-bar.visible { display: block; }
.status-bar.error { color: var(--error); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🎙️ Qwen3 Voice Chat</h1>
  <div class="header-controls">
    <div class="mode-toggle">
      <button id="modeText" class="active" onclick="setMode('text')">文字</button>
      <button id="modeVoice" onclick="setMode('voice')">语音</button>
      <button id="modeAuto" onclick="setMode('auto')">自动</button>
    </div>
    <select id="voiceSelect">
      <option value="serena">Serena</option>
      <option value="Vivian">Vivian</option>
      <option value="Ethan">Ethan</option>
      <option value="Chelsie">Chelsie</option>
    </select>
    <label>
      <span>TTS</span>
      <label class="toggle-switch">
        <input type="checkbox" id="ttsToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </label>
  </div>
</div>

<!-- Chat Messages -->
<div class="chat-area" id="chatArea">
  <div class="message assistant">
    <div class="role-tag">Assistant</div>
    <div class="content">你好！我是 Qwen 语音助手。你可以用文字或语音和我对话。点击麦克风按钮开始录音，或直接输入文字。</div>
  </div>
</div>

<!-- Thinking Indicator -->
<div class="thinking" id="thinking">
  <span class="dots">思考中</span>
</div>

<!-- Status Bar -->
<div class="status-bar" id="statusBar"></div>

<!-- Input Area -->
<div class="input-area">
  <div class="input-row">
    <textarea id="inputText" placeholder="输入消息... (Ctrl+Enter 发送)" rows="1"
              oninput="autoResize(this)"></textarea>
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()" title="按住说话">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="settings-row">
    <span>API: <input type="text" id="apiUrl"></span>
    <span id="recordingStatus"></span>
  </div>
</div>

<script>
// ============================================================================
// State
// ============================================================================
let chatHistory = [];  // {role, content}
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let isProcessing = false;
let currentMode = 'text';  // 'text', 'voice', 'auto'

// Auto-detect API URL
document.getElementById('apiUrl').value = window.location.origin;

// ============================================================================
// Mode
// ============================================================================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
}

// ============================================================================
// Auto resize textarea
// ============================================================================
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ============================================================================
// Status
// ============================================================================
function setStatus(msg, type = '') {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar visible' + (type ? ' ' + type : '');
}

function clearStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

// ============================================================================
// Add message to chat
// ============================================================================
function addMessage(role, content, audioUrl = null, meta = '') {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + role;

  let html = '<div class="role-tag">' + (role === 'user' ? 'You' : 'Assistant') + '</div>';
  html += '<div class="content">' + escapeHtml(content) + '</div>';
  if (audioUrl) {
    html += '<audio controls src="' + audioUrl + '"></audio>';
  }
  if (meta) {
    html += '<div class="meta">' + escapeHtml(meta) + '</div>';
  }
  div.innerHTML = html;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ============================================================================
// Recording
// ============================================================================
async function toggleRecording() {
  if (isProcessing) return;

  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];

    // Use webm/opus for broader browser support
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : 'audio/webm';

    mediaRecorder = new MediaRecorder(stream, { mimeType });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length > 0) {
        const blob = new Blob(audioChunks, { type: mimeType });
        await processAudioInput(blob);
      }
    };

    mediaRecorder.start(100);
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('recordingStatus').textContent = '🔴 录音中...';
  } catch (err) {
    setStatus('无法访问麦克风: ' + err.message, 'error');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('recordingStatus').textContent = '';
}

// ============================================================================
// Process audio input (ASR → LLM → TTS)
// ============================================================================
async function processAudioInput(audioBlob) {
  if (isProcessing) return;
  isProcessing = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const apiBase = document.getElementById('apiUrl').value.replace(/\/$/, '');

  try {
    // Step 1: ASR — transcribe audio
    setStatus('正在转录语音...');
    document.getElementById('thinking').className = 'thinking visible';
    document.getElementById('thinking').innerHTML = '<span class="dots">转录中</span>';

    const formData = new FormData();
    formData.append('file', audioBlob, 'recording.webm');
    formData.append('language', 'auto');
    formData.append('response_format', 'json');

    const asrResp = await fetch(apiBase + '/v1/audio/transcriptions', {
      method: 'POST',
      body: formData
    });

    if (!asrResp.ok) {
      let errMsg = 'ASR 服务不可用';
      try { const j = await asrResp.json(); errMsg = j.error?.message || errMsg; } catch {}
      throw new Error(errMsg);
    }

    const asrResult = await asrResp.json();
    const userText = asrResult.text;

    if (!userText || !userText.trim()) {
      throw new Error('未能识别语音内容');
    }

    // Show user message
    const userAudioUrl = URL.createObjectURL(audioBlob);
    addMessage('user', userText, userAudioUrl, 'ASR 识别');

    // Step 2: LLM — generate response
    await generateResponse(userText, apiBase);

  } catch (err) {
    setStatus('处理失败: ' + err.message, 'error');
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    document.getElementById('thinking').className = 'thinking';
  }
}

// ============================================================================
// Send text message
// ============================================================================
async function sendMessage() {
  const input = document.getElementById('inputText');
  const text = input.value.trim();
  if (!text || isProcessing) return;

  input.value = '';
  autoResize(input);

  addMessage('user', text);

  const apiBase = document.getElementById('apiUrl').value.replace(/\/$/, '');
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    await generateResponse(text, apiBase);
  } catch (err) {
    setStatus('处理失败: ' + err.message, 'error');
  } finally {
    isProcessing = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// ============================================================================
// Generate LLM response + optional TTS
// ============================================================================
async function generateResponse(userText, apiBase) {
  // Add to chat history
  chatHistory.push({ role: 'user', content: userText });

  // Show thinking
  document.getElementById('thinking').className = 'thinking visible';
  document.getElementById('thinking').innerHTML = '<span class="dots">思考中</span>';
  setStatus('正在生成回复...');

  const t0 = performance.now();

  // LLM call
  const messages = [
    { role: 'system', content: '你是通义千问，一个有帮助的AI助手。请简洁、自然地回答问题。' },
    ...chatHistory.slice(-10)  // Keep last 10 messages for context
  ];

  const llmResp = await fetch(apiBase + '/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'qwen3.5',
      messages: messages,
      temperature: 0.7,
      max_tokens: 512,
      chat_template_kwargs: { enable_thinking: false }
    })
  });

  if (!llmResp.ok) {
    let errMsg = 'LLM 服务错误';
    try { const j = await llmResp.json(); errMsg = j.error?.message || errMsg; } catch {}
    throw new Error(errMsg);
  }

  const llmResult = await llmResp.json();
  const assistantText = llmResult.choices?.[0]?.message?.content || '';
  const llmTime = ((performance.now() - t0) / 1000).toFixed(1);

  chatHistory.push({ role: 'assistant', content: assistantText });

  // Hide thinking
  document.getElementById('thinking').className = 'thinking';

  // Should we do TTS?
  const ttsEnabled = document.getElementById('ttsToggle').checked;
  const shouldTTS = ttsEnabled && (currentMode === 'voice' || currentMode === 'auto');

  if (shouldTTS && assistantText.trim()) {
    // Generate TTS
    setStatus('正在合成语音...');
    document.getElementById('thinking').className = 'thinking visible';
    document.getElementById('thinking').innerHTML = '<span class="dots">合成语音中</span>';

    try {
      const ttsT0 = performance.now();
      const voice = document.getElementById('voiceSelect').value;

      const ttsResp = await fetch(apiBase + '/v1/audio/speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'qwen3-tts',
          input: assistantText,
          voice: voice,
          response_format: 'wav'
        })
      });

      if (ttsResp.ok) {
        const audioBlob = await ttsResp.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const ttsTime = ((performance.now() - ttsT0) / 1000).toFixed(1);
        const sizeKB = (audioBlob.size / 1024).toFixed(0);

        addMessage('assistant', assistantText, audioUrl,
          `LLM ${llmTime}s · TTS ${ttsTime}s · ${sizeKB}KB`);

        // Auto play
        const audio = new Audio(audioUrl);
        audio.play().catch(() => {});

        clearStatus();
      } else {
        // TTS failed, show text only
        addMessage('assistant', assistantText, null, `LLM ${llmTime}s · TTS 失败`);
        setStatus('TTS 合成失败，仅显示文字', 'error');
      }
    } catch (ttsErr) {
      addMessage('assistant', assistantText, null, `LLM ${llmTime}s`);
      setStatus('TTS 异常: ' + ttsErr.message, 'error');
    }
  } else {
    // Text only
    addMessage('assistant', assistantText, null, `LLM ${llmTime}s`);
    clearStatus();
  }

  document.getElementById('thinking').className = 'thinking';

  // Scroll to bottom
  const chatArea = document.getElementById('chatArea');
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ============================================================================
// Keyboard shortcuts
// ============================================================================
document.getElementById('inputText').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    sendMessage();
  }
});

// Space to toggle recording when input is empty
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA'
      && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    toggleRecording();
  }
});
</script>
</body>
</html>
