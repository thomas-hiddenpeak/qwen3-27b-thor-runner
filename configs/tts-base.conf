# TTS 测试 — Base (基础模型 / 音色克隆)
#
# 用法:
#   qwen35-thor serve --config configs/tts-base.conf
#
# 模型: Qwen3-TTS-12Hz-1.7B-Base
# Base 模型支持零样本音色克隆 (需参考音频), 也可作为通用 TTS 使用
# 注: 音色克隆 (reference audio) 功能尚未在引擎中实现

# ============================================================================
# LLM 模型
# ============================================================================
model_dir=/home/rm01/models/dev/llm/Qwen/Qwen3.5-4B
kv_cache_budget_gb=8.0

# ============================================================================
# 缓存 & MTP
# ============================================================================
cache_enabled=true
cache_dir=/tmp/qwen_kv_cache
max_cache_gb=20
chunk_size=256
cache_ssm_state=true
eviction_policy=lru
mtp_mode=auto
mtp_kv_blocks=256
mtp_num_drafts=2

# ============================================================================
# HTTP 服务
# ============================================================================
host=0.0.0.0
ollama_port=11434
openai_port=8080
max_conns=128
model_name=qwen3.5-4b
timeout=300
max_output_tokens=32768

# ============================================================================
# TTS — Base (基础模型)
# ============================================================================
tts_enabled=true
tts_mode=native
tts_model=/home/rm01/models/dev/tts/Qwen/Qwen3-TTS-12Hz-1.7B-Base
tts_language=auto

# 语音对话系统提示词 — 引导 LLM 输出适合 TTS 的文本
# Base 模式不支持 instruct，情感标注会被解析但不生效
# 用 \n 表示换行
voice_system_prompt=你是一个语音助手，回答将通过语音播放。\n\n【格式】每句话前用方括号标注贴合句意的情感，如：\n[温柔]你好啊。[开心]今天天气真不错！[认真]我来帮你看看。\n举例可选：平静、温柔、开心、兴奋、惊讶、认真、俏皮、安慰、关切、鼓励、好奇、轻松、热情、自信\n\n【规则】\n1. 不用 Markdown、特殊符号，数字用中文读法

# 采样参数
tts_temperature=0.9
tts_top_k=50
tts_top_p=1.0
tts_rep_penalty=1.05
tts_max_tokens=4096
