# txn545/Qwen3.5-122B-A10B-NVFP4 — NVIDIA ModelOpt NVFP4 MoE 配置文件
#
# 用法:
#   qwen35-thor serve --config configs/qwen3.5-122b-a10b-nvfp4-nomtp.conf
#   qwen35-thor chat  --config configs/qwen3.5-122b-a10b-nvfp4-nomtp.conf
#
# 模型架构 (自动从 config.json 检测):
#   hidden_size=3072, num_hidden_layers=48
#   num_attn_heads=32, num_kv_heads=2, head_dim=256
#   linear: nkh=16, kd=128, nvh=64, vd=128, conv_k=4
#   12 full-attn layers + 36 linear-attn layers (interval=4)
#   MoE: 256 experts, top-8, moe_intermediate_size=1024
#   shared_expert_intermediate_size=1024
#   NVFP4 量化 (experts + shared expert MLP), 注意力层保持 BF16
#   MTP: 1 层 (全 BF16), mtp_num_hidden_layers=1
#   权重 ~83 GB on disk, 122B total params, 10B active params

# ============================================================================
# 模型 (Engine)
# ============================================================================

model_dir=/home/rm01/models/dev/llm/txn545/Qwen3.5-122B-A10B-NVFP4

# ============================================================================
# GPU KV Cache (Engine)
# ============================================================================

# NVFP4 MoE 模型权重更小, 128 GB 统一内存中可用空间更多
# 每 1 GB ≈ 2048 blocks ≈ 32768 tokens (12 full-attn layers, 2 KV heads, head_dim=256)
kv_cache_budget_gb=2.0

# ============================================================================
# SSD 前缀缓存 (Engine — Prefix Caching)
# ============================================================================

cache_enabled=true
cache_dir=/tmp/qwen_kv_cache
max_cache_gb=20
chunk_size=256
cache_ssm_state=true
eviction_policy=lru

# ============================================================================
# Prefill 分块 (Engine — Chunked Prefill)
# ============================================================================

max_chunk_size=2048

# ============================================================================
# SSM/Conv 并发槽位 (Engine — Concurrency)
# ============================================================================

# 122B 权重 ~83 GB, 128 GB 统一内存余量有限, 32 slots 安全
max_ssm_slots=32

# ============================================================================
# MTP 投机解码 (Engine — Multi-Token Prediction)
# ============================================================================

# 122B 模型 MTP: 禁用 (nomtp 配置)
mtp_mode=off

# ============================================================================
# HTTP 服务 (Serve)
# ============================================================================

host=0.0.0.0
ollama_port=11434
openai_port=8080
webui_port=9527
max_conns=128
model_name=qwen3.5-122b-a10b-nvfp4
timeout=300
max_output_tokens=32768
