# Qwen3.5-27B Thor — 统一默认配置文件
#
# 用法:
#   qwen35-thor serve --config configs/qwen3.5-27b.conf
#   qwen35-thor chat  --config configs/qwen3.5-27b.conf
#
# 格式: key=value (每行一个, # 开头为注释)
# CLI 参数始终覆盖配置文件中的同名选项
#
# 此文件同时包含引擎(Engine)和服务(Serve)配置
# 也可以用 --serve-config 单独覆盖服务配置

# ============================================================================
# 模型 (Engine)
# ============================================================================

# 模型权重目录 (包含 *.safetensors + config.json + tokenizer.json)
model_dir=/home/rm01/models/dev/llm/Qwen/Qwen3.5-27B

# ============================================================================
# GPU KV Cache (Engine)
# ============================================================================

# GPU KV Cache 内存预算 (GB)
# 控制统一内存中 Paged KV Cache 的大小
# 每 1 GB ≈ 1024 blocks ≈ 16384 tokens (Qwen3.5-27B, 16 full-attn layers)
# 4.0 GB → 65536 tokens (单请求), 8.0 GB → 131072 tokens (推荐多并发)
# Thor 128GB 统一内存, 模型占 ~52 GB, 视觉编码器 ~4 GB, 推荐 8-16 GB
kv_cache_budget_gb=8.0

# ============================================================================
# SSD 前缀缓存 (Engine — Prefix Caching)
# ============================================================================

# 总开关 (true/false)
cache_enabled=true

# SSD 缓存目录 (建议放在 NVMe SSD 上)
cache_dir=/tmp/qwen_kv_cache

# 最大 SSD 缓存容量 (GB)
# Jetson AGX Thor 配备的 SSD 容量通常为 64-128 GB
# 建议预留系统空间, 设为总 SSD 的 50-70%
max_cache_gb=20

# Token chunk 大小 (必须是 block_size=16 的倍数)
# 较大的 chunk 减少元数据开销但降低前缀匹配粒度
# 推荐: 256 (平衡颗粒度和开销)
chunk_size=256

# 是否缓存 SSM/Conv 状态
# Qwen3.5 混合架构 (48 层 DeltaNet): 开启后每个快照额外 ~147 MB
# 关闭时只缓存 KV, 恢复时需要从头重新计算 SSM 状态
# 推荐: true (完整恢复, 避免 SSM 重算)
cache_ssm_state=true

# 驱逐策略 (目前仅支持 lru)
eviction_policy=lru

# ============================================================================
# Prefill 分块 (Engine — Chunked Prefill)
# ============================================================================

# Prefill 分块大小 (tokens), 长 prompt 超过此值时自动分块
# 更大的 chunk 减少权重重复读取, 降低 TTFT, 但增加 per-layer 显存压力
# 范围: 64-4096 (>4096 会触发 CUTLASS TMA 描述符错误)
# 推荐: 2048 (相比 256, TTFT 降低 17-37%)
max_chunk_size=2048

# ============================================================================
# SSM/Conv 并发槽位 (Engine — Concurrency)
# ============================================================================

# SSM/Conv 状态池大小, 决定最大并发请求数
# 每 slot ~75 MB (SSM 72 MB + Conv 2.88 MB), 64 slots ≈ 4.8 GB
# 范围: 1-256, 可通过 CLI --max-ssm-slots 128 覆盖
# 128 slots (9.6 GB) 可支持 128 并发, 在 128 GB 总内存中安全
max_ssm_slots=128

# ============================================================================
# MTP 投机解码 (Engine — Multi-Token Prediction)
# ============================================================================

# MTP 模式: auto (模型有 MTP 权重则启用), on (强制开), off (强制关)
mtp_mode=auto

# MTP 专用 KV Cache blocks (每 block 16 tokens, 默认 256 = 4096 max tokens)
# MTP 只需要 1 层 full-attn KV, 内存开销很小 (~16 MB)
mtp_kv_blocks=256

# 每步生成的 draft token 数 (1~8, 默认 3 → 最多 4 tokens/step)
# 较小的值 accept rate 更高但单步 token 少, 较大的值反之
mtp_num_drafts=3

# ============================================================================
# HTTP 服务 (Serve)
# ============================================================================

# 监听地址
host=0.0.0.0

# Ollama 兼容 API 端口 (默认 11434)
ollama_port=11434

# OpenAI 兼容 API 端口 (默认 8080)
openai_port=8080

# 最大并发连接数
max_conns=128

# 模型显示名称 (API 返回的 model 字段)
model_name=qwen3.5-27b

# 请求超时 (秒), 单次生成超时后自动终止
timeout=300

# 单请求最大生成 token 上限 (稳定性护栏)
# 客户端请求的 max_tokens 超过此值时自动截断
# 防止单请求长时间占用 GPU
max_output_tokens=32768

# ============================================================================
# ASR 插件 (语音转文本)
# ============================================================================

# 启用 ASR 插件 (true/false)
#asr_enabled=true

# ASR 可执行文件路径 (支持 whisper-cli, sherpa-onnx-offline-recognizer 等)
#asr_executable=/usr/local/bin/whisper-cli

# ASR 模型路径
#asr_model=/path/to/whisper-model.bin

# 默认语言 ("auto" 自动检测, 或 "zh", "en", "ja" 等)
#asr_language=auto

# CPU 线程数
#asr_threads=4

# 额外 CLI 参数 (直接追加到命令行)
#asr_extra_args=

# ============================================================================
# TTS 插件 (文本转语音)
# ============================================================================

# 启用 TTS 插件 (true/false)
#tts_enabled=true

# TTS 可执行文件路径 (支持 piper, sherpa-onnx-offline-tts, espeak-ng 等)
#tts_executable=/usr/local/bin/piper

# TTS 模型路径
#tts_model=/path/to/tts-model.onnx

# 默认语音名称
#tts_voice=default

# 默认语速 (0.5-2.0)
#tts_speed=1.0

# 输出格式 (wav/mp3/opus/pcm)
#tts_format=wav

# 额外 CLI 参数
#tts_extra_args=
