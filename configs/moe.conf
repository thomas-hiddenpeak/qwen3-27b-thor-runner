# Qwen3.5-35B-A3B (MoE) — 默认配置文件
#
# 用法:
#   qwen3-27b-thor serve --config configs/moe.conf
#   qwen3-27b-thor chat  --config configs/moe.conf
#   qwen3-27b-thor bench --config configs/moe.conf --decode 30
#
# 格式: key=value (每行一个, # 开头为注释)
# CLI 参数始终覆盖配置文件中的同名选项
#
# 模型架构 (自动从 config.json 检测):
#   hidden_size=2048, num_hidden_layers=40
#   num_attn_heads=16, num_kv_heads=2, head_dim=256
#   linear: nkh=16, kd=128, nv=32, vd=128, conv_k=4
#   10 full-attn layers + 30 linear-attn layers (interval=4)
#   MoE: 256 experts, top-8, moe_intermediate_size=512
#   shared_expert_intermediate_size=512
#   权重 ~67 GB BF16, 含 MTP
#   35B total params, 3B active params (A3B)

# ============================================================================
# 模型 (Engine)
# ============================================================================

model_dir=/home/rm01/models/dev/llm/Qwen/Qwen3.5-35B-A3B

# ============================================================================
# GPU KV Cache (Engine)
# ============================================================================

# GPU KV Cache 内存预算 (GB)
# MoE 模型权重 ~67 GB, Thor 128GB 统一内存, 可用空间有限
# 每 1 GB ≈ 2048 blocks ≈ 32768 tokens (10 full-attn layers, 2 KV heads, head_dim=256)
# 2.0 GB 适合单请求, 4.0 GB 支持多并发
kv_cache_budget_gb=2.0

# ============================================================================
# SSD 前缀缓存 (Engine — Prefix Caching)
# ============================================================================

# 总开关 (true/false)
cache_enabled=true

# SSD 缓存目录 (建议放在 NVMe SSD 上)
cache_dir=/tmp/qwen_kv_cache

# 最大 SSD 缓存容量 (GB)
max_cache_gb=20

# Token chunk 大小 (必须是 block_size=16 的倍数)
chunk_size=256

# 是否缓存 SSM/Conv 状态
# MoE 模型有 30 层 DeltaNet: 开启后每个快照额外 SSM 状态
# 推荐: true (完整恢复, 避免 SSM 重算)
cache_ssm_state=true

# 驱逐策略
eviction_policy=lru

# ============================================================================
# MTP 投机解码 (Engine — Multi-Token Prediction)
# ============================================================================

# MTP 模式: auto (模型有 MTP 权重则启用)
mtp_mode=auto

# MTP 专用 KV Cache blocks (每 block 16 tokens, 默认 256 = 4096 max tokens)
mtp_kv_blocks=256

# MoE 最优 draft 数: 1
# 测试结果 (Qwen3.5-35B-A3B MoE, B=1):
#   OFF:  18.8 tok/s (baseline)
#   d=1:  22.1 tok/s, 73% accept, +17.6%  ← 最优
#   d=2:  21.7 tok/s, 59% accept, +15.4%
#   d=3:  18.5 tok/s, 41% accept, -1.6%
# d=1 最优: 256-expert routing 使每个 draft 开销较大, d=1 平衡最佳
mtp_num_drafts=1

# ============================================================================
# HTTP 服务 (Serve)
# ============================================================================

# 监听地址
host=0.0.0.0

# Ollama 兼容 API 端口 (默认 11434)
ollama_port=11434

# OpenAI 兼容 API 端口 (默认 8080)
openai_port=8080

# 最大并发连接数
max_conns=128

# 模型显示名称
model_name=qwen3.5-35b-a3b

# 请求超时 (秒)
timeout=300

# 单请求最大生成 token 上限
max_output_tokens=32768
