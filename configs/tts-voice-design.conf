# TTS 测试 — VoiceDesign (创造音色)
#
# 用法:
#   qwen35-thor serve --config configs/tts-voice-design.conf
#
# 模型: Qwen3-TTS-12Hz-1.7B-VoiceDesign
# 通过 instruct 文字描述来创造音色 (无 speaker ID, 由描述决定声音特征)

# ============================================================================
# LLM 模型
# ============================================================================
model_dir=/home/rm01/models/dev/llm/Qwen/Qwen3.5-4B
kv_cache_budget_gb=8.0

# ============================================================================
# 缓存 & MTP
# ============================================================================
cache_enabled=true
cache_dir=/tmp/qwen_kv_cache
max_cache_gb=20
chunk_size=256
cache_ssm_state=true
eviction_policy=lru
mtp_mode=auto
mtp_kv_blocks=256
mtp_num_drafts=2

# ============================================================================
# HTTP 服务
# ============================================================================
host=0.0.0.0
ollama_port=11434
openai_port=8080
max_conns=128
model_name=qwen3.5-4b
timeout=300
max_output_tokens=32768

# ============================================================================
# TTS — VoiceDesign (创造音色)
# ============================================================================
tts_enabled=true
tts_mode=native
tts_model=/home/rm01/models/dev/tts/Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
tts_language=auto

# 音色描述指令 — 用文字描述期望的声音特征
tts_instruct=请用一种温柔甜美的年轻女声来朗读

# 语音对话系统提示词 — 引导 LLM 输出带情感标注的 TTS 文本
# VoiceDesign 模式：tts_instruct 定义全局音色，每句的 [情感] 控制该句语气变化
# 留空则使用程序内置的默认提示词 (包含完整的情感标注教学)
#voice_system_prompt=

# 采样参数
tts_temperature=0.9
tts_top_k=50
tts_top_p=1.0
tts_rep_penalty=1.05
tts_max_tokens=4096
