# Qwen3.5-4B Thor — BF16 配置文件
#
# 用法:
#   qwen35-thor serve --config configs/qwen3.5-4b.conf
#   qwen35-thor chat  --config configs/qwen3.5-4b.conf
#   qwen35-thor bench --config configs/qwen3.5-4b.conf --decode 30
#
# 模型架构 (自动从 config.json 检测):
#   hidden_size=2560, intermediate_size=9216, 32 layers
#   num_attn_heads=16, num_kv_heads=4, head_dim=256
#   linear: nkh=16, kd=128, nv=32, vd=128
#   8 full-attn layers + 24 linear-attn layers
#   tie_word_embeddings=true (lm_head 共享 embed_tokens)
#   权重 ~8.7 GB BF16, 含 MTP

# ============================================================================
# 模型 (Engine)
# ============================================================================

model_dir=/home/rm01/models/dev/llm/Qwen/Qwen3.5-4B

# ============================================================================
# GPU KV Cache (Engine)
# ============================================================================

# 4B 模型仅 ~8.7 GB, 大量空间可用于 KV Cache
# 每 1 GB ≈ 2048 blocks ≈ 32768 tokens (8 full-attn layers)
kv_cache_budget_gb=8.0

# ============================================================================
# SSD 前缀缓存 (Engine — Prefix Caching)
# ============================================================================

cache_enabled=true
cache_dir=/tmp/qwen_kv_cache
max_cache_gb=20
chunk_size=256
cache_ssm_state=true
eviction_policy=lru

# ============================================================================
# MTP 投机解码 (Engine — Multi-Token Prediction)
# ============================================================================

mtp_mode=auto
mtp_kv_blocks=256
mtp_num_drafts=2

# ============================================================================
# HTTP 服务 (Serve)
# ============================================================================

host=0.0.0.0
ollama_port=11434
openai_port=8080
max_conns=128
model_name=qwen3.5-4b
timeout=300
max_output_tokens=32768

# 语音对话系统提示词 — 引导 LLM 输出带情感标注的 TTS 文本
# 用 \n 表示换行; 程序自动解析 [情感] 标注并作为 TTS instruct 传递
voice_system_prompt=你是一个语音助手，回答将通过语音播放。\n\n【格式】每句话前用方括号标注贴合句意的情感，如：\n[温柔]你好啊。[开心]今天天气真不错！[认真]我来帮你看看。\n举例可选：平静、温柔、开心、兴奋、惊讶、认真、俏皮、安慰、关切、鼓励、好奇、轻松、热情、自信\n\n【规则】\n1. 不用 Markdown、特殊符号，数字用中文读法

# ============================================================================
# TTS 语音合成 (Text-to-Speech)
# ============================================================================

# 启用 TTS 插件
#tts_enabled=true

# TTS 模式: native (内置引擎) 或 subprocess (外部程序)
#tts_mode=native

# TTS 模型路径 (三种模型类型由 config.json 中 tts_model_type 自动检测):
#   custom_voice   — 预制音色 (speaker ID), 例: Qwen3-TTS-12Hz-1.7B-CustomVoice
#   voice_design   — 创造音色 (instruct 描述), 例: Qwen3-TTS-12Hz-1.7B-VoiceDesign
#   voice_clone    — 复制音色 (参考音频, 尚未支持)
#tts_model=/home/rm01/models/dev/tts/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice

# 默认语音 (custom_voice 模式下的 speaker name)
#tts_voice=serena

# 默认语言 (auto/zh/en)
#tts_language=auto

# VoiceDesign 模式的音色描述 (voice_design 模式生效)
# 例: "请用一种温柔甜美的女声来朗读"
#tts_instruct=

# TTS 采样参数
#tts_temperature=0.9
#tts_top_k=50
#tts_top_p=1.0
#tts_rep_penalty=1.05

# 最大生成 token 数
#tts_max_tokens=4096
